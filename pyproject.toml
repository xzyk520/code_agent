[project]
name = "beecode"
version = "0.1.0"
description = "Bee Code 内核：agent loop、上下文、工具、补丁（Python 侧）"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
beecode = "beecode.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beecode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/python"]
pythonpath = ["."]        # 让 `from beecode import ...` 在未安装时也能跑

[tool.ruff]
line-length = 110
target-version = "py311"
