[project]
name = "beecode"
version = "0.1.0"
description = "Bee Code 内核：agent loop、上下文、工具、补丁（Python 侧）"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
beecode = "beecode.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beecode"]


[tool.ruff]
line-length = 110
target-version = "py311"
