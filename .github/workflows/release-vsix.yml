name: Build platform VSIX

on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: "Publish the built VSIX files to the VS Code Marketplace"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: win32-x64
          - name: macOS arm64
            os: macos-14
            target: darwin-arm64
          - name: Linux x64
            os: ubuntu-22.04
            target: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundled Python
        run: node scripts/bundle-python.mjs
        env:
          BEE_RUNTIME_TARGET: ${{ matrix.target }}

      - name: Typecheck and build extension
        run: |
          npm run typecheck
          npm run build

      - name: Package VSIX
        run: node scripts/package-platform.mjs ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: bee-code-${{ matrix.target }}
          path: dist-vsix/*.vsix
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bee Code ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: artifacts/**/*.vsix


  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_marketplace == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish platform packages
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*/*.vsix)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No VSIX files found" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            case "$file" in
              *win32-x64*) target=win32-x64 ;;
              *win32-arm64*) target=win32-arm64 ;;
              *darwin-arm64*) target=darwin-arm64 ;;
              *darwin-x64*) target=darwin-x64 ;;
              *linux-x64*) target=linux-x64 ;;
              *linux-arm64*) target=linux-arm64 ;;
              *)
                echo "Unknown target for $file" >&2
                exit 1
                ;;
            esac
            echo "Publishing $file ($target)"
            vsce publish --packagePath "$file" --target "$target" --skip-duplicate
          done
